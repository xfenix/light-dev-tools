# Installs the dependencies, checks the types, the lint and the tests, builds
# the site and publishes it from master

name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Needed by the publish step to push the built site to the gh-pages branch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run predeploy
      - name: Publish
        # Pull requests are built to check them, but only master goes live
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
